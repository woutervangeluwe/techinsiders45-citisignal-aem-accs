<script nonce="aem">
  alloy("configure", {
    defaultConsent: "in",
    edgeDomain: "edge.adobedc.net",
    edgeBasePath: "ee",
    datastreamId: "202b4998-dec5-4923-a068-5688a11f3205",
    orgId: "907075E95BF479EC0A495C73@AdobeOrg",
    debugEnabled: true,
    idMigrationEnabled: false,
    thirdPartyCookiesEnabled: false,
    prehidingStyle: ".personalization-container { opacity: 0 !important }",
  });

  window["alloy"]("sendEvent", {
    conversation: {
      fetchConversationalExperience: true
    }
  }).then(result => {
    console.log("Conversation experience fetched", result);

    if (!document.getElementById('brand-concierge-mount')) {
      const mount = document.createElement('div');
      mount.id = 'brand-concierge-mount';
      document.body.appendChild(mount);
    }

    window["alloy"]("bootstrapConversationalExperience", {
      selector: "#brand-concierge-mount",
      src: "/scripts/brandconciergemain.js",
      stylingConfigurations: window.styleConfiguration,
      stickySession: true
    });

    setTimeout(() => {
      const mount = document.getElementById('brand-concierge-mount');
      mount.style.display = 'none';

      const toggle = document.createElement('button');
      toggle.id = 'brand-concierge-toggle';
      toggle.setAttribute('aria-label', 'Open chat');
      toggle.innerHTML = `
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28"
             viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>`;
      document.body.appendChild(toggle);

      toggle.addEventListener('click', () => {
        const isExpanded = mount.style.display === 'flex';
        if (isExpanded) {
          mount.style.display = 'none';
          toggle.setAttribute('aria-label', 'Open chat');
          toggle.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>`;
        } else {
          mount.style.display = 'flex';
          toggle.setAttribute('aria-label', 'Close chat');
          toggle.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>`;
        }
      });
    }, 500);
  });
</script>
